<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TECH-AGUS - información</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ejecutivo.css">  
</head>
<body>
<div id="map" aria-label="Mapa de proyectos"></div>
<main id="ui">
  <header class="card">
    <div class="marca"><span style="color:#34A853;">TECH-AGUS </span></div>
    <h1>
  | Avance de Obras <br><b><span style="color:#34A853;">| Proyecto Grupo Tech - Agus</span></b>
</h1>

<p class="descripcion">
  Información pública • Sin datos corporativos ni confidenciales • Página en construcción
</p>
<br>

<nav id="paises" class="tabs" aria-label="Países"></nav>
    <input id="buscar" type="search" placeholder="Buscar obra, lugar o empresa" aria-label="Buscar obra">
    <nav id="tipos" class="chips" aria-label="Tipo de obra"></nav>
  </header>
  <section id="detalle" class="card"></section>
</main>
<button id="datos-btn" class="icono-datos" aria-label="Datos del mapa: importar o exportar" title="Datos"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></button>
<div id="stats" class="stats card" aria-label="Resumen"></div>
<!-- Panel ejecutivo -->
<aside id="exec" class="exec card"
       aria-label="Panel ejecutivo" hidden></aside>

<!-- Botón para abrir indicadores en tablet y móvil -->
<button id="exec-toggle" class="exec-toggle"
        type="button"
        aria-controls="exec"
        aria-expanded="false">

    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M14 4v16"/>
    </svg>

    <span id="exec-toggle-label">Indicadores</span>
</button>  
<div class="cta-wrap"><button id="cta" class="cta"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>En Construcción</button></div>
<dialog id="subida" class="modal">
  <h2>En Construcción - Subí tu foto de la obra</h2>
  <label class="campo">Obra <select id="obra-sel"></select></label>
  <div id="zona" class="zona">
    <p>Importación de Imagenes</p>
    <label class="btn">Elegir imágenes<input id="subir" type="file" accept="image/*" multiple hidden></label>
    <label class="btn">Importar carpeta<input id="carpeta" type="file" webkitdirectory hidden></label>
    <p id="msg" class="nota" role="status"></p>
  </div>
  <button id="cerrar-modal" class="btn">Listo</button>
</dialog>
<dialog id="datos-modal" class="modal ancho">
  <div class="fila"><h2 style="margin:0">Datos del mapa</h2><button id="datos-x" class="cerrar" aria-label="Cerrar">✕</button></div>
  <div id="datos-cuerpo"></div>
</dialog>
<div id="toast" role="status"></div>
<dialog id="visor"><img alt="Imagen ampliada"></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/obras.js"></script>
<script src="js/config.js"></script>
<script src="js/fuente.js"></script>
<script>
// Primero se leen los datos (local, archivo importado, URL o SharePoint) y recién después arranca el mapa.
cargarObras().then(() => {
  // 1. Aplicación principal
  const app = document.createElement('script');
  app.src = 'js/app.js';

  app.onload = () => {
    // 2. Panel ejecutivo (depende de app.js)
    const ejecutivo = document.createElement('script');
    ejecutivo.src = 'js/ejecutivo.js';

    ejecutivo.onload = () => {
      // 3. Administración
      const admin = document.createElement('script');
      admin.src = 'js/admin.js';
      document.body.appendChild(admin);
    };

    document.body.appendChild(ejecutivo);
  };

  document.body.appendChild(app);
});
</script>
</body>
</html>
