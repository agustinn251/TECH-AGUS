<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TECH-AGUS - información</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ejecutivo.css">  
</head>
<body>
<div id="map" aria-label="Mapa de proyectos"></div>
<main id="ui">
  <header class="card">
    <div class="marca"><span style="color:#34A853;">TECH-AGUS </span></div>
    <h1>
  | Avance de Obras <br><b><span style="color:#34A853;">| Proyecto Grupo Tech - Agus</span></b>
</h1>

<button id="filtros-toggle" class="filtros-toggle" type="button" aria-expanded="false" aria-controls="paises buscar tipos">
  <span id="filtros-label">Filtros</span>
  <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</button>

<p class="descripcion">
  Información pública
</p>
<p class="descripcion">
  Sin datos corporativos ni confidenciales
</p>
<br>

<nav id="paises" class="tabs" aria-label="Países"></nav>
    <input id="buscar" type="search" placeholder="Buscar obra, lugar o empresa" aria-label="Buscar obra">
    <nav id="tipos" class="chips" aria-label="Tipo de obra"></nav>
  </header>
  <div id="aviso-datos" class="aviso-datos" role="alert" hidden></div>
  <div class="obras-controls">
    <button id="obras-toggle" class="obras-toggle" type="button"
            aria-expanded="false" aria-controls="detalle">
      <span aria-hidden="true">☷</span>
      <span>Obras</span>
      <b id="obras-count">0</b>
    </button>
  </div>

  <section id="detalle" class="card"></section>

</main>
<button id="datos-btn" class="icono-datos" aria-label="Datos del mapa: importar o exportar" title="Datos"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></button>
<div id="stats" class="stats card" aria-label="Resumen"></div>
<!-- Panel ejecutivo -->
<aside id="exec" class="exec card"
       aria-label="Panel ejecutivo" hidden></aside>

<!-- Botón para abrir el portafolio ejecutivo en tablet y móvil -->
<button id="exec-toggle" class="exec-toggle"
        type="button"
        aria-controls="exec"
        aria-expanded="false">

    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M14 4v16"/>
    </svg>

    <span id="exec-toggle-label">Portafolio Ejecutivo</span>
</button>

<div id="toast" role="status"></div>
<dialog id="visor"><button class="visor-nav visor-prev" type="button" aria-label="Imagen anterior">‹</button><img alt="Imagen ampliada"><button class="visor-nav visor-next" type="button" aria-label="Imagen siguiente">›</button></dialog>
<!-- Equipo: grilla de responsables por país -->
<dialog id="equipo" class="modal ancho" aria-label="Responsables por país">
  <div class="fila"><h2 style="margin:0">Responsables</h2><button id="equipo-x" class="cerrar" aria-label="Cerrar">✕</button></div>
  <p class="nota" id="equipo-nota" style="margin:8px 0 0"></p>
  <div id="equipo-grid" class="equipo-grid"></div>
</dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/obras.js"></script>
<script src="js/config.js"></script>
<script src="js/fuente.js"></script>
<script>
cargarObras().then(() => {
  const app = document.createElement('script');
  app.src = 'js/app.js';

  app.onload = () => {
    const ejecutivo = document.createElement('script');
    ejecutivo.src = 'js/ejecutivo.js';

    ejecutivo.onload = () => {
      const admin = document.createElement('script');
      admin.src = 'js/admin.js';
      document.body.appendChild(admin);
    };

    document.body.appendChild(ejecutivo);
  };

  document.body.appendChild(app);
});
</script>
</body>
</html>
